<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<script>
  (() => {
    let saved = null;
    try { saved = localStorage.getItem("theme"); } catch (e) {}
    document.documentElement.dataset.theme = saved
      || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Разведчик вакансий</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b0561f'/%3E%3Ccircle cx='28' cy='28' r='13' fill='none' stroke='white' stroke-width='5'/%3E%3Cpath d='M38 38 L50 50' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700;800&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: oklch(1 0 0);
    --surface: oklch(0.97 0.003 40);
    --raised: oklch(1 0 0);
    --dark: oklch(0.23 0.012 40);
    --on-dark: #fff;
    --ink: oklch(0.24 0.015 40);
    --muted: oklch(0.45 0.015 40);
    --accent: oklch(0.58 0.15 42);
    --accent-deep: oklch(0.46 0.125 42);
    --accent-soft: oklch(0.96 0.02 42);
    --line: oklch(0.9 0.004 40);
    --strong-bg: oklch(0.94 0.05 145); --strong-ink: oklch(0.38 0.1 145);
    --maybe-bg:  oklch(0.95 0.05 75);  --maybe-ink:  oklch(0.42 0.1 60);
    --weak-bg:   oklch(0.95 0.005 40); --weak-ink:   oklch(0.5 0.01 40);
    --skip-bg:   oklch(0.94 0.04 25);  --skip-ink:   oklch(0.45 0.13 25);
    --display: "Bitter", Georgia, serif;
    --body: "Golos Text", "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: oklch(0.17 0.008 40);
    --surface: oklch(0.21 0.01 40);
    --raised: oklch(0.235 0.011 40);
    --dark: oklch(0.28 0.014 40);
    --on-dark: oklch(0.95 0.005 40);
    --ink: oklch(0.93 0.006 40);
    --muted: oklch(0.71 0.014 40);
    --accent: oklch(0.75 0.14 52);
    --accent-deep: oklch(0.8 0.13 58);
    --accent-soft: oklch(0.26 0.03 45);
    --line: oklch(0.32 0.009 40);
    --strong-bg: oklch(0.26 0.05 145); --strong-ink: oklch(0.82 0.13 145);
    --maybe-bg:  oklch(0.28 0.05 70);  --maybe-ink:  oklch(0.85 0.12 70);
    --weak-bg:   oklch(0.26 0.008 40); --weak-ink:   oklch(0.72 0.01 40);
    --skip-bg:   oklch(0.28 0.05 25);  --skip-ink:   oklch(0.82 0.11 25);
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 1rem; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
  p { margin: 0; }
  a { color: var(--accent-deep); text-underline-offset: 3px; }
  button, input, select { font: inherit; color: inherit; }
  .wrap { max-width: 68rem; margin-inline: auto; padding: clamp(1.5rem, 4vw, 2.75rem) clamp(1rem, 4vw, 2.5rem) 4rem; }

  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; margin-bottom: 0.5rem; }
  h1 { font-size: clamp(1.7rem, 4vw, 2.4rem); font-weight: 800; letter-spacing: -0.015em; }
  .tagline { color: var(--muted); margin-top: 0.35rem; max-width: 46em; }
  .theme-switch { width: 2.5rem; height: 2.5rem; border-radius: 50%; border: 1px solid var(--line); background: var(--raised); cursor: pointer; flex: none; font-size: 1.05rem; }
  .theme-switch:hover { border-color: var(--accent); }

  .panel { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; margin: 1.75rem 0 1.25rem; }
  .panel input { flex: 1 1 18rem; padding: 0.55rem 1rem; border: 1px solid var(--line); border-radius: 999px; background: var(--raised); }
  .panel select { padding: 0.55rem 0.8rem; border: 1px solid var(--line); border-radius: 999px; background: var(--raised); }
  .panel button { padding: 0.55rem 1.4rem; border: 0; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; transition: transform 0.2s var(--ease); }
  :root[data-theme="dark"] .panel button { color: oklch(0.18 0.01 40); }
  .panel button:hover { transform: translateY(-1px); }
  .panel button[disabled] { opacity: 0.55; cursor: progress; transform: none; }

  .control { border: 1px solid var(--line); border-radius: 14px; padding: 1rem 1.1rem; margin: 1.5rem 0 1.25rem; background: var(--raised); }
  .ctl-row { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
  .ctl-row + .ctl-row { margin-top: 0.75rem; }
  .ctl-row input[type=url] { flex: 1 1 22rem; padding: 0.5rem 0.9rem; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); }
  .ctl-row input[type=number] { padding: 0.35rem 0.5rem; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  .ctl-row button { padding: 0.5rem 1.2rem; border: 0; border-radius: 999px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  :root[data-theme="dark"] .ctl-row button { color: oklch(0.18 0.01 40); }
  .ctl-row button.ghost { background: none; border: 1px solid var(--line); color: inherit; font-weight: 500; }
  .ctl-row button.ghost:hover { border-color: var(--accent); }
  .ctl-note { color: var(--muted); font-size: 0.87rem; }
  .grow { flex: 1; }
  .dot { width: 0.7rem; height: 0.7rem; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--strong-ink); box-shadow: 0 0 0 4px var(--strong-bg); }
  .dot.busy { background: var(--maybe-ink); box-shadow: 0 0 0 4px var(--maybe-bg); }
  .dot.err { background: var(--skip-ink); box-shadow: 0 0 0 4px var(--skip-bg); }

  .tabs { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1.1rem; }
  .tabs button { padding: 0.4rem 1rem; border: 1px solid var(--line); border-radius: 999px; background: var(--raised); cursor: pointer; font-size: 0.9rem; }
  .tabs button.active { background: var(--dark); color: var(--on-dark); border-color: var(--dark); }

  .row-actions { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.85rem; }
  .row-actions button { padding: 0.3rem 0.9rem; border: 1px solid var(--line); border-radius: 999px; background: var(--raised); cursor: pointer; font-size: 0.85rem; }
  .row-actions button:hover { border-color: var(--accent); }
  .row-actions button.primary { background: var(--accent); border-color: transparent; color: #fff; font-weight: 600; }
  :root[data-theme="dark"] .row-actions button.primary { color: oklch(0.18 0.01 40); }

  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: 0.75rem; margin-bottom: 1.5rem; }
  .summary div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0.7rem 0.95rem; }
  .summary b { display: block; font-family: var(--display); font-size: 1.5rem; color: var(--accent-deep); line-height: 1.15; }
  .summary span { font-size: 0.85rem; color: var(--muted); }

  .card { border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 14px; padding: 1.1rem 1.25rem; margin-bottom: 0.9rem; background: var(--raised); transition: border-color 0.2s; }
  .card.strong { border-left-color: var(--strong-ink); }
  .card.maybe  { border-left-color: var(--maybe-ink); }
  .card.skip   { border-left-color: var(--skip-ink); opacity: 0.62; }
  .card-head { display: flex; flex-wrap: wrap; gap: 0.5rem 0.9rem; align-items: baseline; }
  .card-head h3 { font-size: 1.08rem; font-weight: 700; flex: 1 1 20rem; }
  .card-head .who { color: var(--muted); font-weight: 500; }
  .badge { font-size: 0.78rem; font-weight: 700; padding: 0.15rem 0.7rem; border-radius: 999px; white-space: nowrap; }
  .badge.strong { background: var(--strong-bg); color: var(--strong-ink); }
  .badge.maybe  { background: var(--maybe-bg);  color: var(--maybe-ink); }
  .badge.weak   { background: var(--weak-bg);   color: var(--weak-ink); }
  .badge.skip   { background: var(--skip-bg);   color: var(--skip-ink); }
  .meta { display: flex; flex-wrap: wrap; gap: 0.4rem 1.1rem; margin-top: 0.5rem; font-size: 0.87rem; color: var(--muted); }
  .meta .money { color: var(--accent-deep); font-weight: 600; }

  .bar { height: 5px; border-radius: 3px; background: var(--surface); margin-top: 0.75rem; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

  .why { margin-top: 0.8rem; display: grid; gap: 0.4rem; font-size: 0.9rem; }
  .why div { display: flex; gap: 0.5rem; }
  .why .k { flex: none; width: 6.5rem; color: var(--muted); font-size: 0.83rem; padding-top: 0.1rem; }
  .chip { display: inline-block; background: var(--accent-soft); border-radius: 6px; padding: 0.05rem 0.45rem; margin: 0 0.25rem 0.25rem 0; font-size: 0.83rem; }
  .warn { color: var(--skip-ink); }

  details { margin-top: 0.8rem; border-top: 1px solid var(--line); padding-top: 0.6rem; }
  summary { cursor: pointer; font-size: 0.88rem; color: var(--muted); }
  .letter { white-space: pre-wrap; font-size: 0.9rem; background: var(--surface); border-radius: 10px; padding: 0.9rem 1rem; margin-top: 0.6rem; }
  .copy { margin-top: 0.5rem; padding: 0.3rem 0.9rem; border: 1px solid var(--line); border-radius: 999px; background: var(--raised); cursor: pointer; font-size: 0.85rem; }
  .copy:hover { border-color: var(--accent); }

  .note { color: var(--muted); font-size: 0.9rem; margin-top: 1.5rem; }
  .empty { padding: 3rem 1rem; text-align: center; color: var(--muted); }
  .banner { background: var(--accent-soft); border-left: 3px solid var(--accent); border-radius: 0 10px 10px 0; padding: 0.7rem 1rem; margin-bottom: 1.25rem; font-size: 0.9rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Разведчик вакансий</h1>
      <p class="tagline">Сам собирает вакансии по расписанию, оценивает по моему профилю и объясняет оценку. Отклик не отправляет: решение остаётся за человеком.</p>
    </div>
    <button class="theme-switch" id="themeToggle" type="button" title="Переключить тему"></button>
  </header>

  <div class="banner" id="banner" hidden></div>

  <section class="control">
    <div class="ctl-row">
      <span class="dot" id="dot"></span>
      <b id="stateText">…</b>
      <span class="ctl-note" id="stateNote"></span>
      <span class="grow"></span>
      <button id="btnLogin" type="button" class="ghost">Войти в hh</button>
      <button id="btnScan" type="button" class="ghost">Собрать сейчас</button>
      <button id="btnToggle" type="button">Включить скаут</button>
    </div>
    <div class="ctl-row">
      <input id="searchUrl" type="url" placeholder="Ссылка на выдачу hh по резюме">
      <label class="ctl-note">каждые
        <input id="interval" type="number" min="15" step="15" style="width:5rem"> мин
      </label>
      <button id="btnSave" type="button" class="ghost">Сохранить</button>
    </div>
    <div class="banner" id="banner" hidden></div>
  </section>

  <div class="tabs" id="tabs">
    <button data-tab="new" class="active">Найдено скаутом</button>
    <button data-tab="analyzed">Разобрано</button>
    <button data-tab="tracked">В трекере</button>
    <button data-tab="demo">Демо</button>
  </div>

  <div class="summary" id="summary"></div>
  <div id="list"></div>
  <p class="note">Оценка - подсказка, а не приговор. Она показывает, на что смотреть в первую очередь, и всегда объясняет, почему.</p>
</div>

<script>
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let tab = "new";

async function api(path, options) {
  const response = await fetch(path, options);
  if (!response.ok) {
    const body = await response.json().catch(() => ({}));
    throw new Error(body.detail || response.statusText);
  }
  return response.json();
}
const post = (path, body) => api(path, {
  method: "POST", headers: { "Content-Type": "application/json" },
  body: body ? JSON.stringify(body) : undefined,
});

async function refreshStatus() {
  const { scout, counts } = await api("/api/status");
  const dot = document.getElementById("dot");
  dot.className = "dot" + (scout.busy ? " busy" : scout.last_error ? " err" : scout.running ? " on" : "");
  document.getElementById("stateText").textContent =
    scout.busy ? "собираю…" : scout.running ? "скаут включён" : "скаут выключен";

  const when = (v) => v ? v.replace("T", " ").slice(5, 16) : "—";
  document.getElementById("stateNote").textContent =
    "последний сбор " + when(scout.last_run) +
    (scout.running ? ", следующий " + when(scout.next_run) : "") +
    " · найдено " + scout.last_found + ", новых " + scout.last_fresh;

  document.getElementById("btnToggle").textContent = scout.running ? "Остановить" : "Включить скаут";
  const banner = document.getElementById("banner");
  banner.hidden = !scout.last_error;
  if (scout.last_error) banner.textContent = scout.last_error + " (чаще всего это выключенный VPN)";

  const urlField = document.getElementById("searchUrl");
  if (document.activeElement !== urlField) urlField.value = scout.search_url || "";
  const intField = document.getElementById("interval");
  if (document.activeElement !== intField) intField.value = scout.interval_minutes;

  document.getElementById("summary").innerHTML =
    '<div><b>' + (counts.total || 0) + '</b><span>всего находок</span></div>' +
    '<div><b>' + (counts.new || 0) + '</b><span>ждут разбора</span></div>' +
    '<div><b>' + (counts.analyzed || 0) + '</b><span>разобрано</span></div>' +
    '<div><b>' + (counts.tracked || 0) + '</b><span>уехало в трекер</span></div>';
}

function card(v, demo) {
  const css = v.css || (v.verdict === "сильный матч" ? "strong" : v.verdict === "пропустить" ? "skip"
            : v.verdict === "стоит посмотреть" ? "maybe" : "weak");
  let money = "не указана";
  if (demo) money = v.salary;
  else if (v.salary_to || v.salary_from) {
    const top = v.salary_to || v.salary_from;
    money = (v.salary_from && v.salary_from !== v.salary_to ? Math.round(v.salary_from/1000) + "-" : "до ")
          + Math.round(top/1000) + "к";
  }
  // Ссылка на выдачу нужна только пока вакансия не разобрана
  const showLink = v.url && v.url !== "#" && v.status !== "analyzed" && v.status !== "tracked";

  let actions = "";
  if (!demo) {
    let buttons = "";
    if (v.status === "new") buttons += '<button class="primary" onclick="analyze(\'' + v.id + '\', this)">Разобрать</button>';
    if (v.status === "analyzed") buttons += '<button class="primary" onclick="mark(\'' + v.id + '\', \'sent\')">Отклик отправлен → в трекер</button>';
    if (v.status !== "tracked") buttons += '<button onclick="mark(\'' + v.id + '\', \'dropped\')">Не интересно</button>';
    actions = '<div class="row-actions">' + buttons + '</div>';
  }

  return '<article class="card ' + css + '">' +
    '<div class="card-head"><h3>' + esc(v.name) + ' <span class="who">· ' + esc(v.employer || "") + '</span></h3>' +
      (v.verdict ? '<span class="badge ' + css + '">' + esc(v.verdict) + ' · ' + v.score + '</span>' : "") +
    '</div>' +
    '<div class="meta"><span class="money">' + esc(money) + '</span>' +
      (v.track ? '<span>трек: ' + esc(v.track) + '</span>' : "") +
      (v.experience ? '<span>' + esc(v.experience) + '</span>' : "") +
      (v.remote ? '<span>удалёнка</span>' : "") +
      (showLink ? '<a href="' + esc(v.url) + '" target="_blank" rel="noopener">открыть вакансию →</a>' : "") +
    '</div>' +
    (v.score != null ? '<div class="bar"><i style="width:' + v.score + '%"></i></div>' : "") +
    '<div class="why">' +
      (v.blockers ? '<div><span class="k">блокеры</span><span class="warn">' + esc(v.blockers) + '</span></div>' : "") +
      (v.matched ? '<div><span class="k">совпало</span><span>' + v.matched.split(", ").map(m => '<span class="chip">' + esc(m) + '</span>').join("") + '</span></div>' : "") +
      (v.gaps ? '<div><span class="k">пробелы</span><span>' + esc(v.gaps) + '</span></div>' : "") +
      (v.notes ? '<div><span class="k">внимание</span><span class="warn">' + esc(v.notes) + '</span></div>' : "") +
    '</div>' +
    (v.letter ? '<details><summary>Черновик сопроводительного</summary><div class="letter" id="l' + esc(v.id) + '">' + esc(v.letter) + '</div><button class="copy" type="button" onclick="copyLetter(\'l' + esc(v.id) + '\', this)">Скопировать</button></details>' : "") +
    actions +
  '</article>';
}

async function load() {
  const list = document.getElementById("list");
  list.innerHTML = '<div class="empty">Загружаю…</div>';
  try {
    if (tab === "demo") {
      const items = await api("/api/demo");
      list.innerHTML = items.map(v => card(v, true)).join("");
      return;
    }
    const items = await api("/api/finds?status=" + tab);
    if (items.length) {
      list.innerHTML = items.map(v => card(v, false)).join("");
    } else {
      list.innerHTML = '<div class="empty">' +
        (tab === "new" ? "Скаут пока ничего не нашёл. Укажите ссылку на выдачу и нажмите «Собрать сейчас»." : "Пусто") +
        '</div>';
    }
  } catch (error) {
    list.innerHTML = '<div class="empty">Ошибка: ' + esc(error.message) + '</div>';
  }
}

async function analyze(id, button) {
  button.disabled = true;
  button.textContent = "разбираю…";
  try {
    await post("/api/finds/" + id + "/analyze");
    await load();
    await refreshStatus();
  } catch (error) {
    button.disabled = false;
    button.textContent = "Разобрать";
    alert(error.message);
  }
}

async function mark(id, status) {
  if (status === "sent" && !confirm("Перенести вакансию в трекер как отправленный отклик?")) return;
  try {
    await post("/api/finds/" + id + "/status", { status });
    await load();
    await refreshStatus();
  } catch (error) {
    alert(error.message);
  }
}

function copyLetter(id, button) {
  navigator.clipboard.writeText(document.getElementById(id).textContent);
  button.textContent = "Скопировано";
  setTimeout(() => (button.textContent = "Скопировать"), 1500);
}

document.getElementById("tabs").addEventListener("click", (e) => {
  const button = e.target.closest("button[data-tab]");
  if (!button) return;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.remove("active"));
  button.classList.add("active");
  tab = button.dataset.tab;
  load();
});

document.getElementById("btnToggle").addEventListener("click", async (e) => {
  const running = e.target.textContent === "Остановить";
  e.target.disabled = true;
  try { await post(running ? "/api/scout/stop" : "/api/scout/start"); }
  catch (error) { alert(error.message); }
  e.target.disabled = false;
  refreshStatus();
});

document.getElementById("btnLogin").addEventListener("click", async (e) => {
  e.target.disabled = true;
  try {
    const r = await post("/api/scout/login");
    alert(r.hint);
  } catch (error) { alert(error.message); }
  e.target.disabled = false;
});

document.getElementById("btnScan").addEventListener("click", async (e) => {
  e.target.disabled = true;
  e.target.textContent = "собираю…";
  try { await post("/api/scout/scan"); } catch (error) { alert(error.message); }
  e.target.disabled = false;
  e.target.textContent = "Собрать сейчас";
  refreshStatus();
  load();
});

document.getElementById("btnSave").addEventListener("click", async () => {
  await post("/api/settings", {
    search_url: document.getElementById("searchUrl").value,
    interval_minutes: parseInt(document.getElementById("interval").value) || 180,
  });
  refreshStatus();
});

const root = document.documentElement;
const toggle = document.getElementById("themeToggle");
const paint = () => {
  const dark = root.dataset.theme === "dark";
  toggle.textContent = dark ? "☀" : "☾";
  toggle.setAttribute("aria-label", dark ? "Светлая тема" : "Тёмная тема");
};
toggle.addEventListener("click", () => {
  root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
  paint();
});
paint();

refreshStatus();
load();
setInterval(refreshStatus, 15000);
</script>
</body>
</html>
